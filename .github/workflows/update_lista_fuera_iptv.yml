name: Actualizar lista IPTV

on:
  schedule:
    - cron: "19 1 * * *"  # Ejecutar todos los días a las 3:00 AM UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio (rama gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages   # Trabajamos directamente sobre la rama de la web

      - name: Descargar archivo .m3u
        id: descarga
        run: |
          URL="https://ipfs.io/ipns/k2k4r8oqlcjxsritt5mczkcn4mmvcmymbqw7113fz2flkrerfwfps004/data/listas/lista_fuera_iptv.m3u"
          DEST="data/lista_fuera_iptv.m3u"

          mkdir -p "$(dirname "$DEST")"
          echo "Descargando lista desde $URL..."

          # Descarga con comprobación de error
          if curl -fsSL "$URL" -o "$DEST"; then
            echo "descarga_exitosa=true" >> $GITHUB_OUTPUT
          else
            echo "::error::No se pudo descargar el archivo desde $URL"
            echo "descarga_exitosa=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Configurar Git
        if: steps.descarga.outputs.descarga_exitosa == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Comprobar si hubo cambios
        if: steps.descarga.outputs.descarga_exitosa == 'true'
        run: |
          if git diff --quiet; then
            echo "No hay cambios en el archivo. No se hace commit."
          else
            git add data/lista_fuera_iptv.m3u
            git commit -m "🔄 Actualización automática de lista IPTV ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push origin gh-pages
            echo "Archivo actualizado y commit realizado correctamente."
          fi

      - name: Log de error (si algo falla)
        if: failure()
        run: |
          echo "::error::El workflow falló al actualizar la lista IPTV. Revisa el registro completo en la pestaña Actions."
