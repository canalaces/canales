name: Actualizar lista IPTV
 
# Evento que activará el flujo de trabajo
on:
 # push:
  #  branches: [ gh-pages ] # Se ejecuta en cada push a la rama principal 
  #pull_request:
  #  branches: [ gh-pages ] # Se ejecuta al crear o actualizar un pull request a la rama principal
  workflow_dispatch:
  schedule:
   - cron: "0 1 * * *"  # A las 1:00
   
permissions:
  contents: write  # Necesario para hacer push al repo

jobs:
  update-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar archivo desde IPFS (con reintento)
        id: download
        run: |
          set -e
          URL="https://ipfs.io/ipns/k2k4r8oqlcjxsritt5mczkcn4mmvcmymbqw7113fz2flkrerfwfps004/data/listas/lista_fuera_iptv.m3u"
          OUTPUT="lista_fuera_iptv.m3u"

          echo "🔽 Intentando descargar el archivo desde $URL ..."
          if ! curl -f -L --retry 1 --retry-delay 2 "$URL" -o "$OUTPUT"; then
            echo "⚠️ Primer intento fallido. Reintentando en 10 segundos..."
            sleep 10
            if ! curl -f -L "$URL" -o "$OUTPUT"; then
              echo "❌ Error: no se pudo descargar el archivo después de 2 intentos." | tee -a error.log
              exit 1
            fi
          fi

          echo "✅ Archivo descargado correctamente: $OUTPUT"

      - name: Subir cambios al repositorio
        if: success()
        run: |
          git config user.name "canalaces"
          git config user.email "canalaces@gmail.com"

          if git diff --quiet --exit-code; then
            echo "No hay cambios en el archivo, no se sube nada."
          else
            git add lista_fuera_iptv.m3u
            git commit -m "Actualización automática de lista IPTV [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push origin gh-pages
          fi

      - name: Registrar error si falla la descarga
        if: failure()
        run: |
          echo "⚠️ Falla detectada al descargar el archivo. Se registrará el error en el log." | tee -a error.log

      - name: Guardar log de error en el repo
        if: failure()
        run: |
          git config user.name "canalaces"
          git config user.email "canalaces@gmail.com"
          git add error.log
          git commit -m "Log de error de descarga [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push origin gh-pages
