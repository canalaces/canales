name: Actualizar Lista

on:
  push:
    branches:
      - gh-pages

  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-lista-rentry
  cancel-in-progress: false

jobs:
  update-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Resolver IPNS
        shell: bash
        run: |
          set -Eeuo pipefail

          IPNS="k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"

          echo "🔎 Resolviendo IPNS..."

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.ipfs.ipns-record" \
            "https://delegated-ipfs.dev/routing/v1/ipns/${IPNS}" \
            -o ipns-record.bin

          echo "✅ IPNS resuelto."
          echo "📦 Registro recibido:"
          ls -lh ipns-record.bin

      - name: Extraer CID del registro IPNS
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "🔎 Analizando registro IPNS..."

          python3 - <<'PY'
          import sys

          data = open("ipns-record.bin", "rb").read()

          marker = b"/ipfs/"
          pos = data.find(marker)

          if pos == -1:
              print("❌ No se encontró /ipfs/ en el registro IPNS.")
              sys.exit(1)

          value = data[pos:].split(b"\x12", 1)[0]
          value = value.decode("utf-8", errors="replace")

          print("📍 Valor IPNS:")
          print(value)

          parts = value.split("/")

          if len(parts) < 3 or parts[1] != "ipfs":
              print("❌ El valor IPNS no contiene una ruta /ipfs/CID válida.")
              sys.exit(1)

          cid = parts[2]

          print("")
          print("==========================================")
          print("✅ CID encontrado:")
          print(cid)
          print("==========================================")
          PY

      # ============================================================
      # 1. Descargar lista desde IPFS
      # ============================================================
      - name: Descargar lista desde nodo IPFS
        shell: bash
        run: |
          set -Eeuo pipefail

          OUTPUT="canales.m3u"

          CID="$(python3 - <<'PY'
          data = open("ipns-record.bin", "rb").read()

          marker = b"/ipfs/"
          pos = data.find(marker)

          if pos == -1:
              raise SystemExit("❌ No se encontró /ipfs/ en el registro IPNS.")

          value = data[pos:].split(b"\x12", 1)[0].decode("utf-8", errors="replace")

          parts = value.split("/")

          if len(parts) < 3 or parts[1] != "ipfs":
              raise SystemExit("❌ El registro IPNS no contiene una ruta /ipfs/CID válida.")

          print(parts[2])
          PY
          )"

          echo "=========================================="
          echo "🌐 Descargando lista desde IPFS"
          echo "=========================================="
          echo "📦 CID: $CID"
          echo ""

          rm -f "$OUTPUT"

          # --------------------------------------------------------
          # Descargar Kubo
          # --------------------------------------------------------

          echo "⬇️ Descargando Kubo..."

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            "https://github.com/ipfs/kubo/releases/download/v0.39.0/kubo_v0.39.0_linux-amd64.tar.gz" \
            -o kubo.tar.gz

          echo "📦 Descomprimiendo Kubo..."

          rm -rf kubo
          tar -xzf kubo.tar.gz

          if [ ! -x "./kubo/ipfs" ]; then
            echo "❌ No se encontró el ejecutable de Kubo."
            find ./kubo -maxdepth 2 -type f -print
            exit 1
          fi

          IPFS="./kubo/ipfs"

          echo "✅ Kubo encontrado."

          # --------------------------------------------------------
          # Crear repositorio IPFS limpio
          # --------------------------------------------------------

          export IPFS_PATH="$RUNNER_TEMP/ipfs"

          rm -rf "$IPFS_PATH"
          mkdir -p "$IPFS_PATH"

          echo "📁 Directorio IPFS:"
          echo "$IPFS_PATH"

          echo ""
          echo "🚀 Inicializando nodo IPFS..."

          "$IPFS" init --profile=server

          # --------------------------------------------------------
          # Iniciar daemon
          # --------------------------------------------------------

          echo ""
          echo "🚀 Iniciando daemon IPFS..."

          "$IPFS" daemon > ipfs-daemon.log 2>&1 &
          IPFS_PID=$!

          trap 'kill "$IPFS_PID" 2>/dev/null || true' EXIT

          # --------------------------------------------------------
          # Esperar a que el API esté disponible
          # --------------------------------------------------------

          echo ""
          echo "⏳ Esperando al daemon IPFS..."

          DAEMON_READY=false

          for i in {1..60}; do
            if "$IPFS" \
              --api=/ip4/127.0.0.1/tcp/5001 \
              id >/dev/null 2>&1; then

              echo "✅ Daemon IPFS listo."
              DAEMON_READY=true
              break
            fi

            sleep 2
          done

          if [ "$DAEMON_READY" != "true" ]; then
            echo "❌ El daemon IPFS no está listo."
            echo ""
            echo "📄 Últimas líneas del log del daemon:"
            tail -n 150 ipfs-daemon.log || true
            exit 1
          fi

          # --------------------------------------------------------
          # Esperar conexiones de red
          # --------------------------------------------------------

          echo ""
          echo "🔗 Esperando conexiones con la red IPFS..."

          PEERS_READY=false

          for i in {1..60}; do

            PEER_COUNT=$(
              "$IPFS" \
                --api=/ip4/127.0.0.1/tcp/5001 \
                swarm peers 2>/dev/null | wc -l || true
            )

            echo "   Intento $i/60 → peers: $PEER_COUNT"

            if [ "$PEER_COUNT" -gt 0 ]; then
              PEERS_READY=true
              echo "✅ Se encontraron peers IPFS."
              break
            fi

            sleep 3
          done

          echo ""
          echo "🔗 Peers actuales:"

          "$IPFS" \
            --api=/ip4/127.0.0.1/tcp/5001 \
            swarm peers | head -n 20 || true

          if [ "$PEERS_READY" != "true" ]; then
            echo "⚠️ No se encontraron peers todavía."
            echo "⚠️ Continuamos para intentar localizar el CID mediante DHT."
          fi

          # --------------------------------------------------------
          # Buscar proveedores del CID
          # --------------------------------------------------------

          echo ""
          echo "🌐 Buscando proveedores del CID..."
          echo "📦 CID: $CID"

          PROVIDERS_FILE="providers.txt"

          rm -f "$PROVIDERS_FILE"

          "$IPFS" \
            --api=/ip4/127.0.0.1/tcp/5001 \
            routing findprovs \
            --num-providers=10 \
            "$CID" \
            > "$PROVIDERS_FILE" 2>&1 || true

          if [ -s "$PROVIDERS_FILE" ]; then
            echo "✅ Resultado de búsqueda de proveedores:"
            cat "$PROVIDERS_FILE"
          else
            echo "⚠️ No se encontraron proveedores mediante DHT."
          fi

          # --------------------------------------------------------
          # Descargar archivo desde IPFS
          # --------------------------------------------------------

          IPFS_PATH_TO_FILE="/ipfs/${CID}/data/listas/lista_fuera_iptv.m3u"

          echo ""
          echo "=========================================="
          echo "⬇️ Descargando archivo desde IPFS"
          echo "=========================================="
          echo "📦 CID: $CID"
          echo "📄 Ruta: $IPFS_PATH_TO_FILE"
          echo ""

          DOWNLOAD_OK=false

          for attempt in 1 2 3; do

            echo "➡️ Intento $attempt de 3..."

            rm -f "$OUTPUT"

            if "$IPFS" \
              --api=/ip4/127.0.0.1/tcp/5001 \
              get \
              --output="$OUTPUT" \
              "$IPFS_PATH_TO_FILE"; then

              if [ -s "$OUTPUT" ]; then
                DOWNLOAD_OK=true
                echo "✅ Descarga completada."
                break
              fi
            fi

            echo "⚠️ El intento $attempt no consiguió descargar el archivo."

            if [ "$attempt" -lt 3 ]; then
              echo "⏳ Esperando 10 segundos antes del siguiente intento..."
              sleep 10
            fi

          done

          # --------------------------------------------------------
          # Diagnóstico si la descarga falla
          # --------------------------------------------------------

          if [ "$DOWNLOAD_OK" != "true" ]; then

            echo ""
            echo "=========================================="
            echo "❌ NO SE PUDO DESCARGAR LA LISTA"
            echo "=========================================="

            echo ""
            echo "📦 CID:"
            echo "$CID"

            echo ""
            echo "📄 Ruta:"
            echo "$IPFS_PATH_TO_FILE"

            echo ""
            echo "🔗 Peers actuales:"

            "$IPFS" \
              --api=/ip4/127.0.0.1/tcp/5001 \
              swarm peers | head -n 30 || true

            echo ""
            echo "🌐 Proveedores encontrados:"
            cat "$PROVIDERS_FILE" || true

            echo ""
            echo "📄 Últimas 150 líneas del daemon:"
            echo "------------------------------------------"
            tail -n 150 ipfs-daemon.log || true
            echo "------------------------------------------"

            exit 1
          fi

          # --------------------------------------------------------
          # Comprobación básica
          # --------------------------------------------------------

          if [ ! -s "$OUTPUT" ]; then
            echo "❌ El archivo está vacío."
            exit 1
          fi

          echo ""
          echo "📦 Tamaño: $(wc -c < "$OUTPUT") bytes"

          # --------------------------------------------------------
          # Comprobaciones del archivo
          # --------------------------------------------------------

          if [ ! -f "$OUTPUT" ]; then
            echo "❌ El archivo no existe."
            exit 1
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "❌ El archivo está vacío."
            exit 1
          fi

          # Elimina CR de archivos Windows/CRLF.
          sed -i 's/\r$//' "$OUTPUT"

          # Obtener primera línea.
          FIRST_LINE="$(head -n 1 "$OUTPUT")"

          echo "📄 Primera línea:"
          echo "$FIRST_LINE"

          # --------------------------------------------------------
          # La cabecera puede ser:
          #
          # #EXTM3U
          #
          # o:
          #
          # #EXTM3U url-tvg="..." refresh="3600"
          #
          # Por eso utilizamos "starts with" y no igualdad exacta.
          # --------------------------------------------------------

          if [[ "$FIRST_LINE" != "#EXTM3U"* ]]; then
            echo "❌ El archivo descargado no parece una lista M3U válida."
            echo ""
            echo "Primeras 5 líneas:"
            head -n 5 "$OUTPUT"
            exit 1
          fi

          # --------------------------------------------------------
          # Comprobamos que existen entradas EXTINF.
          # --------------------------------------------------------

          EXTINF_COUNT=$(grep -c '^#EXTINF' "$OUTPUT" || true)

          if [ "$EXTINF_COUNT" -eq 0 ]; then
            echo "❌ La lista no contiene ninguna entrada #EXTINF."
            echo ""
            echo "Primeras 20 líneas:"
            head -n 20 "$OUTPUT"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$OUTPUT")
          LINE_COUNT=$(wc -l < "$OUTPUT")
          SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')

          echo "=========================================="
          echo "✅ Lista M3U válida"
          echo "=========================================="
          echo "📦 Tamaño: ${FILE_SIZE} bytes"
          echo "📄 Líneas: ${LINE_COUNT}"
          echo "📺 Entradas EXTINF: ${EXTINF_COUNT}"
          echo "🔐 SHA256: ${SHA256}"
          echo "=========================================="

      # ============================================================
      # 2. Obtener contenido actual de Rentry
      # ============================================================
      - name: Obtener versión actual de Rentry
        id: rentry_current
        if: success()
        env:
          RENTRY_EDIT_CODE: ${{ secrets.RENTRY_EDIT_CODE }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${RENTRY_EDIT_CODE:-}" ]; then
            echo "❌ No existe el secret RENTRY_EDIT_CODE."
            echo ""
            echo "Créalo en:"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "=========================================="
          echo "🔎 Consultando contenido actual de Rentry"
          echo "=========================================="

          RESPONSE_FILE="rentry_response.json"
          rm -f "$RESPONSE_FILE"

          SUCCESS=false

          for attempt in 1 2 3; do
            echo "➡️ Intento $attempt de 3..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              --request POST \
              "https://rentry.org/api/fetch/gd3kg" \
              --data-urlencode "edit_code=${RENTRY_EDIT_CODE}") || true

            echo "HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && jq -e . "$RESPONSE_FILE" >/dev/null 2>&1; then
              SUCCESS=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Rentry no respondió correctamente."
              sleep 10
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ No se pudo consultar Rentry."
            cat "$RESPONSE_FILE" || true
            exit 1
          fi

          RENTRY_STATUS=$(jq -r '.status // empty' "$RESPONSE_FILE")

          if [ "$RENTRY_STATUS" != "200" ]; then
            echo "❌ Rentry devolvió un error."

            echo "Status:"
            echo "$RENTRY_STATUS"

            echo "Respuesta:"
            jq . "$RESPONSE_FILE" || true

            exit 1
          fi

          jq -r '.content.text // .content // empty' \
            "$RESPONSE_FILE" > rentry_actual.m3u

          if [ ! -s rentry_actual.m3u ]; then
            echo "❌ No se pudo extraer el contenido actual de Rentry."
            exit 1
          fi

          sed -i 's/\r$//' rentry_actual.m3u

          echo "✅ Contenido actual de Rentry obtenido."

      # ============================================================
      # 3. Comparar contenido
      # ============================================================
      - name: Comprobar si existen cambios
        id: compare
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          NEW_SHA256=$(sha256sum canales.m3u | awk '{print $1}')
          OLD_SHA256=$(sha256sum rentry_actual.m3u | awk '{print $1}')

          echo "=========================================="
          echo "🔍 Comparación"
          echo "=========================================="
          echo "SHA256 Rentry : $OLD_SHA256"
          echo "SHA256 nuevo  : $NEW_SHA256"
          echo "=========================================="

          if cmp -s canales.m3u rentry_actual.m3u; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "✅ No hay cambios."
            echo "ℹ️ Rentry no será modificado."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "🔄 Se han detectado cambios."
            echo "➡️ Rentry será actualizado."
          fi

      # ============================================================
      # 4. Actualizar Rentry
      # ============================================================
      - name: Actualizar Rentry
        id: rentry_update
        if: success() && steps.compare.outputs.changed == 'true'
        env:
          RENTRY_EDIT_CODE: ${{ secrets.RENTRY_EDIT_CODE }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🔄 Actualizando Rentry"
          echo "=========================================="

          RESPONSE_FILE="rentry_update_response.json"

          rm -f "$RESPONSE_FILE"

          UPDATED=false

          for attempt in 1 2 3; do
            echo "➡️ Intento $attempt de 3..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 120 \
              --request POST \
              "https://rentry.org/api/edit/gd3kg" \
              --data-urlencode "edit_code=${RENTRY_EDIT_CODE}" \
              --data-urlencode "text@canales.m3u") || true

            echo "HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && jq -e . "$RESPONSE_FILE" >/dev/null 2>&1; then

              RENTRY_STATUS=$(jq -r '.status // empty' "$RESPONSE_FILE")

              if [ "$RENTRY_STATUS" = "200" ]; then
                UPDATED=true
                echo "✅ Rentry actualizado correctamente."
                break
              fi

              echo "⚠️ Rentry respondió con status: $RENTRY_STATUS"

              if [ "$RENTRY_STATUS" = "429" ] || [ "$RENTRY_STATUS" = "503" ]; then
                if [ "$attempt" -lt 3 ]; then
                  echo "⏳ Esperando 20 segundos..."
                  sleep 20
                  continue
                fi
              fi

              echo "❌ Rentry rechazó la actualización."
              jq . "$RESPONSE_FILE" || true
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Error HTTP o respuesta inválida."
              sleep 10
            fi
          done

          if [ "$UPDATED" != "true" ]; then
            echo "❌ No se pudo actualizar Rentry."
            cat "$RESPONSE_FILE" || true
            exit 1
          fi

      # ============================================================
      # 5. Verificar que Rentry contiene exactamente la nueva lista
      # ============================================================
      - name: Verificar actualización de Rentry
        if: success() && steps.compare.outputs.changed == 'true'
        env:
          RENTRY_EDIT_CODE: ${{ secrets.RENTRY_EDIT_CODE }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🔎 Verificando actualización"
          echo "=========================================="

          RESPONSE_FILE="rentry_verify.json"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 20 \
            --max-time 60 \
            --request POST \
            "https://rentry.org/api/fetch/gd3kg" \
            --data-urlencode "edit_code=${RENTRY_EDIT_CODE}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Error HTTP al verificar Rentry: $HTTP_CODE"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          STATUS=$(jq -r '.status // empty' "$RESPONSE_FILE")

          if [ "$STATUS" != "200" ]; then
            echo "❌ Rentry devolvió status $STATUS."
            jq . "$RESPONSE_FILE"
            exit 1
          fi

          jq -r '.content.text // .content // empty' \
            "$RESPONSE_FILE" > rentry_verificado.m3u

          sed -i 's/\r$//' rentry_verificado.m3u

          if cmp -s canales.m3u rentry_verificado.m3u; then
            echo "=========================================="
            echo "✅ VERIFICACIÓN CORRECTA"
            echo "=========================================="
            echo "Rentry contiene exactamente la nueva lista."
          else
            echo "=========================================="
            echo "❌ VERIFICACIÓN FALLIDA"
            echo "=========================================="
            echo "El contenido de Rentry no coincide."
            exit 1
          fi

      # ============================================================
      # 6. Crear log si falla algo
      # ============================================================
      - name: Preparar error.log
        if: failure()
        shell: bash
        run: |
          {
            echo "=========================================="
            echo "ERROR EN ACTUALIZACIÓN DE LISTA"
            echo "=========================================="
            echo "Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "=========================================="
          } > error.log

      # ============================================================
      # 7. Checkout solo si hay que guardar error.log
      # ============================================================
      - name: Checkout para guardar error.log
        if: failure()
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 8. Guardar error.log
      # ============================================================
      - name: Guardar error.log
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "=========================================="
            echo "ERROR EN ACTUALIZACIÓN DE LISTA"
            echo "=========================================="
            echo "Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "=========================================="
          } > error.log

          git config user.name "canalaces"
          git config user.email "canalaces@gmail.com"

          git add error.log

          git commit \
            -m "Log de error de actualización [$(date -u '+%Y-%m-%d %H:%M:%S')]" \
            || echo "ℹ️ No hay cambios en error.log."

          git push origin gh-pages || {
            echo "⚠️ No se pudo subir error.log."
          }

      # ============================================================
      # 9. Resumen
      # ============================================================
      - name: Resumen
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "🎉 PROCESO COMPLETADO"
          echo "=========================================="

          if [ "${{ steps.compare.outputs.changed }}" = "true" ]; then
            echo "🔄 Rentry ha sido actualizado."
          else
            echo "✅ No había cambios."
            echo "ℹ️ Rentry no necesitaba actualización."
          fi

          echo ""
          echo "🌐 Rentry:"
          echo "https://rentry.org/gd3kg"

          echo ""
          echo "📡 Raw:"
          echo "https://rentry.org/gd3kg/raw"

          echo "=========================================="