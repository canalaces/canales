- name: Resolver IPNS
        shell: bash
        run: |
          set -Eeuo pipefail

          IPNS="k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"

          echo "=========================================="
          echo "🔎 Resolviendo IPNS"
          echo "=========================================="
          echo "IPNS: $IPNS"
          echo ""

          echo "➡️ Consultando IPFS DHT/Routing..."

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --max-time 60 \
            "https://delegated-ipfs.dev/routing/v1/providers/${IPNS}" \
            -o routing.json

          echo ""
          echo "📦 Respuesta:"
          cat routing.json

          echo ""
          echo "=========================================="
          echo "✅ Fin del diagnóstico"
          echo "=========================================="
